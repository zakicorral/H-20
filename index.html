<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>H-20 — Case File</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div><span class="eyebrow">CASE FILE</span><strong>H-20</strong></div>
    <button id="saveBtn" class="icon-btn" aria-label="Save">SAVE</button>
  </header>
  <main id="screen" class="screen"></main>
  <nav id="nav" class="bottom-nav" aria-label="Investigation">
    <button data-view="case" class="active">CASE</button>
    <button data-view="evidence">EVIDENCE <span id="evidenceCount">0</span></button>
    <button data-view="phone">PHONE</button>
    <button data-view="notes">NOTES</button>
  </nav>
</div>
<div id="modal" class="modal hidden"></div>
<script src="js/state.js"></script>
<script src="js/evidence.js"></script>
<script src="js/phone.js"></script>
<script src="js/puzzles.js"></script>
<script src="js/game.js"></script>
</body>
</html>
